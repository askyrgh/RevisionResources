intent.putExtra("USER_ID", 42)
startActivity(intent)

// Reading the extra on the receiving side
val userId = intent.getIntExtra("USER_ID", -1)

// Implicit intent — describe the action, let the OS pick a handler
val shareIntent = Intent(Intent.ACTION_SEND).apply {
    type = "text/plain"
    putExtra(Intent.EXTRA_TEXT, "Check this out!")
}
startActivity(Intent.createChooser(shareIntent, "Share via"))</code></pre>
<div class="app"><b>Real-world example:</b> tapping a list item opens a detail screen via an explicit Intent carrying the item's ID; a "Share" button uses an implicit Intent so the OS shows every app capable of handling text (Messages, Email, WhatsApp...).</div>
<p><b>Interview points:</b> distinguish explicit (exact target class — screen-to-screen navigation) from implicit (describes an action — lets the system/user pick a handler); know that extras must be primitive/Parcelable/Serializable types.</p>
<div class="connect"><b>Connects to →</b> Navigation Component (a higher-level alternative for in-app screen navigation).</div>`},
]},
{subgroup:"UI", tabs:[
{id:"an-views", title:"View &amp; XML System", html:`
<h2>Android → View &amp; XML System</h2>
<p class="tag">Tier 5 · High</p>
<div class="def"><b>Definition:</b> the original Android UI toolkit — layouts and widgets are declared in XML resource files, then inflated into a tree of <code>View</code> objects at runtime and manipulated imperatively from code.</div>
<pre><code>&lt;!-- res/layout/activity_main.xml --&gt;
&lt;LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:orientation="vertical"&gt;
    &lt;TextView android:id="@+id/title" android:text="Hello" /&gt;
    &lt;Button android:id="@+id/btn" android:text="Click me" /&gt;
&lt;/LinearLayout&gt;</code></pre>
<pre><code>// Kotlin side — findViewById or View Binding
binding.btn.setOnClickListener {
    binding.title.text = "Clicked!"   // imperative: mutate the View directly
}</code></pre>
<div class="app"><b>Real-world example:</b> most existing/legacy Android codebases still use XML layouts + View Binding; you'll likely maintain such screens even on a Compose-first team.</div>
<p><b>Interview points:</b> know View Binding (type-safe, replaces findViewById) vs the older, unsafe findViewById; understand the tree/imperative mutation model as the contrast point for Compose's declarative model.</p>
<div class="connect"><b>Connects to →</b> Jetpack Compose (the declarative alternative); Activity Lifecycle (setContentView in onCreate).</div>`},
{id:"an-compose", title:"Jetpack Compose", html:`
<h2>Android → Jetpack Compose</h2>
<p class="tag">Tier 5 · Critical (default for new roles)</p>
<div class="def"><b>Definition:</b> Android's modern, declarative UI toolkit — the UI is described as a function of state (<code>@Composable</code> functions), and the framework automatically re-runs ("recomposes") only the parts that depend on data that changed, instead of you manually mutating Views.</div>
<pre><code>@Composable
fun Greeting(name: String) {
    var clicked by remember { mutableStateOf(false) }   // state survives recomposition
    Column {
        Text(text = if (clicked) "Hello, $name!" else "Tap the button")
        Button(onClick = { clicked = true }) { Text("Greet") }
    }
}</code></pre>
<div class="app"><b>Real-world example:</b> the same greeting screen in Compose needs no findViewById/Binding — the UI just re-renders itself whenever <code>clicked</code> changes, because Compose tracks that dependency automatically.</div>
<p><b>Interview points:</b> explain "declarative UI as a function of state" and recomposition vs the imperative View system's manual mutation; know <code>remember</code>/<code>mutableStateOf</code> as the basic state-holding building blocks, and that Compose functions are just regular higher-order/composable Kotlin functions under the hood.</p>
<div class="connect"><b>Connects to →</b> Higher-Order Functions (Composables take @Composable lambdas as parameters); StateFlow (commonly collected as Compose state via collectAsState()).</div>`},
]},
{subgroup:"Architecture", tabs:[
{id:"an-viewmodel", title:"ViewModel &amp; UI State", html:`
<h2>Android → ViewModel &amp; UI State</h2>
<p class="tag">Tier 5 · Critical</p>
<div class="def"><b>Definition:</b> a lifecycle-aware class that holds UI-related data and survives configuration changes (like screen rotation) that would otherwise destroy and recreate the Activity/Fragment, so in-progress data and network calls aren't lost.</div>
<pre><code>class UserViewModel(private val repo: UserRepository) : ViewModel() {
    private val _uiState = MutableStateFlow<UiState>(UiState.Loading)
    val uiState: StateFlow<UiState> = _uiState

    fun loadUser(id: Int) {
        viewModelScope.launch {              // auto-cancelled when the ViewModel is cleared
            _uiState.value = UiState.Success(repo.getUser(id))
        }
    }
}
val vm: UserViewModel by viewModels()   // delegated property — Activity/Fragment gets the SAME
                                          // instance across configuration changes</code></pre>
<div class="app"><b>Real-world example:</b> a profile screen keeps showing already-loaded data after the user rotates their phone, instead of re-fetching from the network and flashing a loading spinner again.</div>
<p><b>Interview points:</b> explain exactly why a ViewModel survives rotation while the Activity doesn't (it's retained by the framework across the Activity's destroy/recreate cycle, tied to a longer-lived scope), and why it must never hold a direct Activity/View reference (memory leak).</p>
<div class="connect"><b>Connects to →</b> Coroutines (viewModelScope), StateFlow (Flow tab), Delegated properties (by viewModels()).</div>`},
{id:"an-navigation", title:"Navigation Component", html:`
<h2>Android → Navigation Component</h2>
<p class="tag">Tier 5 · High</p>
<div class="def"><b>Definition:</b> a Jetpack library that manages moving between screens (destinations) through a declared navigation graph, handling the back stack, argument passing, and transitions consistently instead of manual Intent/FragmentTransaction juggling.</div>
<pre><code>// Compose Navigation
val navController = rememberNavController()
NavHost(navController, startDestination = "home") {
    composable("home") { HomeScreen(onOpenDetail = { id ->
        navController.navigate("detail/$id")
    }) }
    composable("detail/{id}") { backStackEntry ->
        val id = backStackEntry.arguments?.getString("id")
        DetailScreen(id)
    }
}</code></pre>
<div class="app"><b>Real-world example:</b> a "Home → Detail → Settings" flow where the system back button naturally retraces Detail then Home, because Navigation manages the back stack for you.</div>
<p><b>Interview points:</b> know why Navigation is preferred over raw Intents for in-app screens (consistent back-stack handling, type-safe argument passing, single source of truth for the app's navigation graph).</p>
<div class="connect"><b>Connects to →</b> Intents (the lower-level mechanism it wraps for in-app cases); Jetpack Compose (NavHost is composable-based).</div>`},
{id:"an-mvvm", title:"MVVM / Clean Architecture", html:`
<h2>Android → MVVM / Clean Architecture</h2>
<p class="tag">Tier 5 · Critical</p>
<div class="def"><b>Definition:</b> MVVM (Model-View-ViewModel) separates UI (View) from UI logic/state (ViewModel) from data (Model/Repository), so the View just observes state and the ViewModel never references the View directly. Clean Architecture adds a further Domain/UseCase layer between ViewModel and data sources for larger apps.</div>
<div class="flow">View (Activity/Composable)
   │ observes state, sends user actions
   ▼
ViewModel   (UI state, no Android View references)
   │ calls
   ▼
Repository   (single source of truth — decides Room vs Retrofit)
   │
   ▼
Room (local DB)  /  Retrofit (network)</div>
<pre><code>class UserRepository(private val api: ApiService, private val dao: UserDao) {
    suspend fun getUser(id: Int): User =
        dao.getUser(id) ?: api.fetchUser(id).also { dao.insert(it) }   // local-first
}</code></pre>
<div class="app"><b>Real-world example:</b> a Repository that returns cached Room data instantly while a Retrofit call refreshes it in the background — the ViewModel doesn't know or care which source the data came from.</div>
<p><b>Interview points:</b> be ready to draw the View → ViewModel → Repository → (Room/Retrofit) flow from memory and explain why each layer only depends on the one directly below it (testability, replaceable data sources).</p>
<div class="connect"><b>Connects to →</b> Interfaces (Repository is usually an interface, for testability); ViewModel &amp; UI State; Room and Retrofit below.</div>`},
]},
{subgroup:"Data", tabs:[
{id:"an-room", title:"Room", html:`
<h2>Android → Room</h2>
<p class="tag">Tier 5 · Critical</p>
<div class="def"><b>Definition:</b> Jetpack's local database library — a type-safe wrapper over SQLite. You declare entities (tables), DAOs (query interfaces), and a Database class; Room generates the SQL boilerplate and can return results as Flow for reactive updates.</div>
<pre><code>@Entity data class Note(@PrimaryKey val id: Int, val text: String)

@Dao interface NoteDao {
    @Query("SELECT * FROM Note") fun getAll(): Flow<List<Note>>   // live query
    @Insert suspend fun insert(note: Note)
}

@Database(entities = [Note::class], version = 1)
abstract class AppDatabase : RoomDatabase() {
    abstract fun noteDao(): NoteDao
}</code></pre>
<div class="app"><b>Real-world example:</b> a notes app where the list screen collects <code>noteDao.getAll()</code> as a Flow — the UI updates automatically the instant a note is inserted or deleted, with no manual refresh call.</div>
<p><b>Interview points:</b> know the three building blocks (Entity/DAO/Database) and why returning Flow from a DAO gives "live" reactive queries versus a one-shot <code>suspend fun</code> that returns a plain List.</p>
<div class="connect"><b>Connects to →</b> Flow (DAOs commonly return it); Data Classes (Entities are typically data classes); MVVM (Repository sits in front of Room).</div>`},
{id:"an-retrofit", title:"Retrofit &amp; OkHttp", html:`
<h2>Android → Retrofit &amp; OkHttp</h2>
<p class="tag">Tier 5 · Critical</p>
<div class="def"><b>Definition:</b> Retrofit turns an HTTP API into a type-safe Kotlin interface, converting JSON responses into data classes automatically; OkHttp is the underlying HTTP client handling the actual network requests, connection pooling, and interceptors.</div>
<pre><code>interface ApiService {
    @GET("users/{id}")
    suspend fun getUser(@Path("id") id: Int): User   // suspend fun — plugs straight into coroutines
}

val retrofit = Retrofit.Builder()
    .baseUrl("https://api.example.com/")
    .addConverterFactory(GsonConverterFactory.create())
    .build()
val api = retrofit.create(ApiService::class.java)

// usage inside a coroutine:
val user = api.getUser(42)</code></pre>
<div class="app"><b>Real-world example:</b> defining an ApiService interface once, then injecting it into a Repository — Retrofit handles serialization, threading off the main thread, and error propagation via ordinary Kotlin exceptions.</div>
<p><b>Interview points:</b> know that a Retrofit method marked <code>suspend</code> automatically runs off the main thread and integrates directly with coroutines, no manual callback/thread-switching code needed — a big improvement over the old Callback-based API.</p>
<div class="connect"><b>Connects to →</b> Coroutines (suspend functions); Interfaces (ApiService is defined as one); MVVM (Repository wraps it).</div>`},
{id:"an-datastore", title:"DataStore", html:`
<h2>Android → DataStore</h2>
<p class="tag">Tier 5 · Good to know</p>
<div class="def"><b>Definition:</b> Jetpack's modern replacement for SharedPreferences — stores small amounts of key-value or typed data asynchronously, exposing reads as a Flow so UI can react to preference changes automatically.</div>
<pre><code>val Context.dataStore by preferencesDataStore(name = "settings")
val DARK_MODE = booleanPreferencesKey("dark_mode")

suspend fun setDarkMode(context: Context, enabled: Boolean) {
    context.dataStore.edit { prefs -> prefs[DARK_MODE] = enabled }
}
val darkModeFlow: Flow<Boolean> = context.dataStore.data.map { it[DARK_MODE] ?: false }</code></pre>
<div class="app"><b>Real-world example:</b> a "dark mode" toggle in settings whose Flow is collected by the whole app, so the theme updates immediately everywhere the moment the preference changes — no manual broadcast needed.</div>
<p><b>Interview points:</b> know why DataStore replaced SharedPreferences — it's fully asynchronous (no main-thread disk I/O risk) and Flow-based rather than relying on a synchronous, listener-based API.</p>
<div class="connect"><b>Connects to →</b> Flow (its read API); Delegated properties (the dataStore by ... declaration).</div>`},
]},
{id:"an-di", title:"Dependency Injection (Hilt / Koin)", html:`
<h2>Android → Dependency Injection</h2>
<p class="tag">Tier 5 · Critical</p>
<div class="def"><b>Definition:</b> instead of a class constructing its own dependencies (a Repository creating its own Retrofit instance), they're supplied ("injected") from outside — usually by a DI framework that builds and manages a graph of objects and their lifetimes. Hilt (built on Dagger) and Koin are the two dominant Android options.</div>
<pre><code>// Hilt
@HiltAndroidApp class MyApp : Application()

@Module @InstallIn(SingletonComponent::class)
object NetworkModule {
    @Provides @Singleton
    fun provideApi(): ApiService = Retrofit.Builder()/* ... */.build().create(ApiService::class.java)
}

@HiltViewModel
class UserViewModel @Inject constructor(private val repo: UserRepository) : ViewModel()</code></pre>
<div class="app"><b>Real-world example:</b> swapping a real ApiService for a fake one in tests just by providing a different Module — the ViewModel's code never changes because it only depends on the injected interface.</div>
<p><b>Interview points:</b> explain the core benefit — decoupling + testability (a class depending on an interface can be given a fake in tests without touching its code) — and know Hilt is compile-time/annotation-based (faster, more setup) versus Koin being a lighter runtime DSL.</p>
<div class="connect"><b>Connects to →</b> Interfaces (what gets injected); Application Class (Hilt hooks in via @HiltAndroidApp); ViewModel (constructor injection).</div>`},
{id:"an-workmanager", title:"WorkManager", html:`
<h2>Android → WorkManager</h2>
<p class="tag">Tier 5 · Good to know</p>
<div class="def"><b>Definition:</b> Jetpack's API for deferrable, guaranteed background work that must run even if the app closes or the device restarts — distinct from coroutines, which only run while their scope is alive (e.g. tied to a ViewModel or app process).</div>
<pre><code>class UploadWorker(ctx: Context, params: WorkerParameters) : CoroutineWorker(ctx, params) {
    override suspend fun doWork(): Result {
        return try {
            uploadPendingFiles()
            Result.success()
        } catch (e: Exception) { Result.retry() }
    }
}
val request = OneTimeWorkRequestBuilder<UploadWorker>()
    .setConstraints(Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build())
    .build()
WorkManager.getInstance(context).enqueue(request)</code></pre>
<div class="app"><b>Real-world example:</b> queuing a photo upload that must eventually complete even if the user closes the app immediately after tapping "upload" — WorkManager persists the request and runs it once network connectivity returns.</div>
<p><b>Interview points:</b> know when to reach for WorkManager over a plain coroutine — anything that must survive process death and doesn't need to run immediately (uploads, periodic sync, log flushing).</p>
<div class="connect"><b>Connects to →</b> Coroutines (CoroutineWorker wraps a suspend function); contrast with viewModelScope's shorter lifetime.</div>`},
{id:"an-testing", title:"Testing", html:`
<h2>Android → Testing</h2>
<p class="tag">Tier 5 · High</p>
<div class="def"><b>Definition:</b> Android testing splits into fast, JVM-only unit tests (business logic, ViewModels) and slower instrumented UI tests that run on a device/emulator (user-facing behaviour).</div>
<div class="table-scroll"><table><tr><th>Tool</th><th>Tests</th><th>Runs on</th></tr>
<tr><td>JUnit</td><td>Unit tests — functions, ViewModels, Repositories</td><td>Local JVM (fast)</td></tr>
<tr><td>MockK / Mockito</td><td>Fake dependencies (mock a Repository interface)</td><td>Local JVM</td></tr>
<tr><td>Espresso / Compose Testing</td><td>UI behaviour — taps, assertions on screen</td><td>Emulator/device</td></tr></table></div>
<pre><code>@Test
fun loadUser_updatesStateToSuccess() = runTest {          // coroutine test
    val fakeRepo = mockk<UserRepository> {
        coEvery { getUser(1) } returns User(1, "Ana")
    }
    val vm = UserViewModel(fakeRepo)
    vm.loadUser(1)
    assertEquals(UiState.Success(User(1, "Ana")), vm.uiState.value)
}</code></pre>
<div class="app"><b>Real-world example:</b> testing a ViewModel's loadUser() logic with a mocked Repository — fast, no device needed — while a separate Compose UI test verifies the actual button click updates the visible text.</div>
<p><b>Interview points:</b> know why MVVM/Clean Architecture (interfaces + injected dependencies) is what makes unit testing possible at all — without it you can't substitute a fake Repository.</p>

<h2>Android → Gradle &amp; Project Structure</h2>
<p class="tag">Tier 5 · Good to know</p>
<div class="def"><b>Definition:</b> Gradle is the build system that compiles, packages, and manages dependencies for an Android app, configured via Kotlin DSL (<code>build.gradle.kts</code>) files; <code>AndroidManifest.xml</code> declares the app's components and permissions; the <code>res/</code> folder holds externalized resources (strings, dimens, themes) so UI text/values aren't hardcoded.</div>
<pre><code>// app/build.gradle.kts
dependencies {
    implementation("androidx.core:core-ktx:1.13.0")
    implementation("com.squareup.retrofit2:retrofit:2.11.0")
}</code></pre>
<pre><code>&lt;!-- AndroidManifest.xml --&gt;
&lt;manifest&gt;
    &lt;uses-permission android:name="android.permission.INTERNET" /&gt;
    &lt;application android:name=".MyApp"&gt;
        &lt;activity android:name=".MainActivity" android:exported="true"&gt;
            &lt;intent-filter&gt;
                &lt;action android:name="android.intent.action.MAIN" /&gt;
            &lt;/intent-filter&gt;
        &lt;/activity&gt;
    &lt;/application&gt;
&lt;/manifest&gt;</code></pre>
<div class="app"><b>Real-world example:</b> declaring the INTERNET permission in the Manifest and a network library version in Gradle are both required before a single Retrofit call will work — missing either causes a runtime crash or build failure respectively.</div>
<p><b>Interview points:</b> know that every Activity must be declared in the Manifest to be launchable, and that resource externalization (strings.xml, dimens.xml) is what enables features like localization and consistent theming.</p>

const tablistEl = document.getElementById('tablist');
const panelWrap = document.getElementById('panel-wrap');
const allTabs = [];

function renderEntry(entry, container, groupColor, depth){
  if(entry.subgroup){
    const label = document.createElement('div');
    label.className = 'subgroup-label';
    label.style.paddingLeft = (0.6 + depth * 0.6) + 'rem';
    label.textContent = entry.subgroup;
    container.appendChild(label);
    const wrap = document.createElement('div');
    wrap.className = 'subgroup-wrap';
    wrap.style.marginLeft = (depth * 0.4) + 'rem';
    container.appendChild(wrap);
    entry.tabs.forEach(child => renderEntry(child, wrap, groupColor, depth + 1));
    return;
  }
  const btn = document.createElement('button');
  btn.setAttribute('role','tab');
  btn.id = 'tab-' + entry.id;
  btn.setAttribute('aria-controls','panel-' + entry.id);
  btn.setAttribute('aria-selected','false');
  btn.setAttribute('tabindex','-1');
  if(depth === 1) btn.classList.add('nested');
  if(depth >= 2) btn.classList.add('nested2');
  btn.style.setProperty('--tab-color', groupColor);
  btn.innerHTML = entry.title;
  btn.addEventListener('click', () => selectTab(entry.id));
  container.appendChild(btn);

  const panel = document.createElement('div');
  panel.setAttribute('role','tabpanel');
  panel.id = 'panel-' + entry.id;
  panel.setAttribute('aria-labelledby','tab-' + entry.id);
  panel.setAttribute('tabindex','0');
  panel.style.setProperty('--panel-color', groupColor);
  panel.hidden = true;
  panel.innerHTML = entry.html;
  panel.querySelectorAll('table').forEach(t => {
    const rows = Array.from(t.querySelectorAll('tr'));
    if(rows.length > 1){
      const headers = Array.from(rows[0].children).map(c => c.textContent.trim());
      rows.slice(1).forEach(row => {
        Array.from(row.children).forEach((cell, i) => {
          if(headers[i]) cell.setAttribute('data-label', headers[i]);
        });
      });
    }
    const w = document.createElement('div');
    w.className = 'table-scroll';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });
  panelWrap.appendChild(panel);
  allTabs.push(entry.id);
}

DATA.forEach(group => {
  const label = document.createElement('div');
  label.className = 'group-label';
  label.textContent = group.group;
  tablistEl.appendChild(label);
  group.tabs.forEach(entry => renderEntry(entry, tablistEl, group.color, 0));
});

const menuBtn = document.getElementById('menuBtn');
const backdrop = document.getElementById('backdrop');
const currentLabel = document.getElementById('currentLabel');

function openDrawer(){
  tablistEl.classList.add('open');
  backdrop.classList.add('show');
  menuBtn.setAttribute('aria-expanded','true');
}
function closeDrawer(){
  tablistEl.classList.remove('open');
  backdrop.classList.remove('show');
  menuBtn.setAttribute('aria-expanded','false');
}
menuBtn.addEventListener('click', () => {
  tablistEl.classList.contains('open') ? closeDrawer() : openDrawer();
});
backdrop.addEventListener('click', closeDrawer);

function selectTab(id){
  allTabs.forEach(t => {
    const btn = document.getElementById('tab-' + t);
    const panel = document.getElementById('panel-' + t);
    const active = t === id;
    btn.setAttribute('aria-selected', active ? 'true' : 'false');
    btn.setAttribute('tabindex', active ? '0' : '-1');
    panel.hidden = !active;
    if(active){
      panel.scrollTop = 0;
      currentLabel.textContent = btn.textContent;
      window.scrollTo(0,0);
    }
  });
  if(window.innerWidth <= 800) closeDrawer();
}
tablistEl.addEventListener('keydown', (e) => {
  const activeEl = document.activeElement;
  if(!activeEl || !activeEl.id || activeEl.getAttribute('role') !== 'tab') return;
  const idx = allTabs.indexOf(activeEl.id.replace('tab-',''));
  if(idx === -1) return;
  let next = null;
  if(e.key === 'ArrowDown' || e.key === 'ArrowRight') next = allTabs[(idx+1) % allTabs.length];
  if(e.key === 'ArrowUp' || e.key === 'ArrowLeft') next = allTabs[(idx-1+allTabs.length) % allTabs.length];
  if(e.key === 'Home') next = allTabs[0];
  if(e.key === 'End') next = allTabs[allTabs.length-1];
  if(next){ e.preventDefault(); selectTab(next); document.getElementById('tab-' + next).focus(); }
});
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeDrawer(); });
selectTab('plan');
</script>
</body>
</html>
